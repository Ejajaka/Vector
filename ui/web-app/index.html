<!doctype html>
<html lang="en" data-theme="dark" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vector — Requirement engineering for UI teams</title>
    <meta name="description" content="Pre-generation completeness review for natural-language UI prompts. Detect elements, link attributes, clarify ambiguity and get a validated rewrite." />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" href="favicon-32.png" />
    <link rel="apple-touch-icon" href="/favicon-512.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta name="theme-color" content="#08090a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vector" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta property="og:title" content="Vector — Requirement engineering for UI teams" />
    <meta property="og:description" content="Pre-generation completeness review for natural-language UI prompts. Detect elements, link attributes, clarify ambiguity and get a validated rewrite." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before paint so the dark shell never flashes light.
      (function () {
        try {
          var stored = localStorage.getItem('prompt_linter_theme_preference');
          var theme = stored === 'light' ? 'light' : 'dark';
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (error) {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
      (function () {
        // A tiny enhancement hook used by Linear-style chrome.
        try {
          if ((navigator.hardwareConcurrency || 4) > 4) document.documentElement.classList.add('enhanced');
        } catch (error) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
