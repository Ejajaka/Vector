<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Page not found — Vector</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #08090a;
        --surface: #101113;
        --line: #23252a;
        --ink: #f7f8f8;
        --muted: #9b9fa8;
        --violet: #7170ff;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        min-height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: "Inter", "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      header {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 24px;
        height: 64px;
        display: flex;
        align-items: center;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        color: var(--ink);
        text-decoration: none;
        font-size: 15px;
        font-weight: 650;
        letter-spacing: -0.02em;
      }
      .mark {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: radial-gradient(circle at 32% 30%, #a5a8ff, var(--violet) 58%, #3a3aa8);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12) inset;
      }
      main {
        flex: 1;
        display: grid;
        place-items: center;
        padding: 48px 24px 96px;
      }
      .card {
        width: 100%;
        max-width: 480px;
        text-align: center;
      }
      .eyebrow {
        margin: 0;
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
      }
      h1 {
        margin: 10px 0 0;
        font-size: clamp(28px, 6vw, 36px);
        line-height: 1.1;
        letter-spacing: -0.035em;
      }
      p.copy {
        margin: 12px auto 0;
        max-width: 380px;
        font-size: 13px;
        line-height: 1.65;
        color: var(--muted);
      }
      .actions {
        margin-top: 26px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 36px;
        padding: 0 16px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 600;
        text-decoration: none;
        transition: background-color 0.15s ease, border-color 0.15s ease;
      }
      .btn-primary {
        background: var(--violet);
        color: #fff;
      }
      .btn-primary:hover { background: #828fff; }
      .btn-ghost {
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--ink);
      }
      .btn-ghost:hover { border-color: #3a3d44; }
      footer {
        padding: 0 24px 28px;
        text-align: center;
        font-size: 10.5px;
        color: #7c828b;
      }
      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: dark;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="brand" href="/" aria-label="Vector home">
        <span class="mark" aria-hidden="true"></span>
        Vector
      </a>
    </header>
    <main>
      <div class="card">
        <p class="eyebrow">404</p>
        <h1>This page does not exist.</h1>
        <p class="copy">
          The link may be old, or the address may have a typo. Everything in Vector lives in your workspace.
        </p>
        <div class="actions">
          <a class="btn btn-primary" href="/">Back to home</a>
          <a class="btn btn-ghost" href="mailto:hello@vector.is-a.dev">Contact us</a>
        </div>
      </div>
    </main>
    <footer>Vector — requirement engineering for UI teams.</footer>
  </body>
</html>
