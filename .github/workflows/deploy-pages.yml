name: Deploy web app to GitHub Pages

# Rebuilds the React web app and publishes it whenever main changes, so the
# live site always matches the repo. No manual gh-pages push needed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync shared engine into the web app
        run: |
          mkdir -p ui/web-app/public/engine
          cp engine/src/taxonomy.js engine/src/semantic.js engine/src/analyzer.js ui/web-app/public/engine/

      - name: Install web app dependencies
        working-directory: ui/web-app
        run: npm ci

      - name: Build web app
        working-directory: ui/web-app
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ui/web-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
