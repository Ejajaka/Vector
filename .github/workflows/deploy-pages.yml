name: Deploy web app to GitHub Pages

# Rebuilds the React web app on every push to main and publishes the build to the
# gh-pages branch, which GitHub Pages serves. This is what makes the live site
# update automatically after you change the code.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync shared engine into the web app
        run: |
          mkdir -p ui/web-app/public/engine
          cp engine/src/taxonomy.js engine/src/semantic.js engine/src/analyzer.js engine/src/llm.js ui/web-app/public/engine/

      - name: Install dependencies
        working-directory: ui/web-app
        run: npm ci

      - name: Build
        working-directory: ui/web-app
        run: npm run build

      - name: Publish to gh-pages
        run: |
          cd ui/web-app/dist
          touch .nojekyll
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
