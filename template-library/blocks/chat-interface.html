<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat interface - Vector block</title><link rel="stylesheet" href="blocks.css"></head>
<body>
<div class="top"><span class="brand"><span class="mark"><i></i></span>Vector</span><span class="crumb">/ <b>Inbox</b></span><input class="search" placeholder="Search projects, briefs, templates..." /><div class="actions"><button class="btn ghost">Ask AI</button><button class="btn primary">Create</button></div></div>
<div class="chat"><div class="threads"><input class="search" style="width:100%;margin:0 0 8px" placeholder="Search threads" /><div class="thread on">Design review</div><div class="thread">Northwind handoff</div><div class="thread">Prompt quality</div><div class="thread">Billing question</div></div>
<div class="messages"><div class="msg">Can you take a look at the review suggestions before we generate?</div><div class="msg me">Yes. The empty state and export scope are the two I want to resolve first.</div><div class="msg">I accepted the high-confidence ones. Coverage is at 92%.</div><div class="composer"><input class="field" placeholder="Message the team..." /><button class="btn primary">Send</button></div></div></div></body></html>
